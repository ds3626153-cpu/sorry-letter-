<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Shreyaa 🥺🫶🏻</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;

    background:
    linear-gradient(
        135deg,
        #ffd6e7,
        #ffeaf4,
        #e7dcff
    );

    color:#5b2945;
    overflow:hidden;
}

.page{
    width:100%;
    min-height:100vh;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    padding:25px;
    text-align:center;
}

.page.active{
    display:flex;
}

.card{
    width:100%;
    max-width:520px;

    padding:35px 25px;

    border-radius:30px;

    background:rgba(255,255,255,0.82);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:
    0 20px 50px rgba(0,0,0,0.15);
}

.emoji{
    font-size:58px;
    margin-bottom:20px;

    animation:floating 2s ease-in-out infinite;
}

.mainText{
    font-size:23px;
    line-height:1.6;
    font-weight:bold;
}

.promise{
    margin-top:25px;
    font-size:20px;
    line-height:1.6;
    color:#743652;
}

.promise small{
    font-size:17px;
}

.musicStatus{
    margin-top:18px;
    font-size:14px;
    color:#9a5877;
}

button{
    margin-top:30px;

    padding:14px 32px;

    border:none;
    border-radius:30px;

    background:
    linear-gradient(
        135deg,
        #ff4f91,
        #ff78ad
    );

    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 10px 25px rgba(255,79,145,0.35);
}

button:active{
    transform:scale(0.94);
}

.videoTitle{
    font-size:24px;
    font-weight:bold;
    color:#66314e;
    margin-bottom:20px;
}

.videoBox{
    width:100%;
    max-width:500px;

    border-radius:25px;
    overflow:hidden;

    background:#000;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.25);
}

video{
    display:block;
    width:100%;
    max-height:70vh;
    background:#000;
}

.finalEmoji{
    font-size:80px;

    animation:floating 2s ease-in-out infinite;
}

.finalText{
    margin-top:20px;

    font-size:34px;
    line-height:1.4;
    font-weight:bold;

    color:#ff3f83;
}

.finalHeart{
    margin-top:20px;
    font-size:48px;
}

.heartFloat{
    position:fixed;
    bottom:-40px;

    pointer-events:none;
    z-index:999;

    animation:
    riseUp 5s linear forwards;
}

@keyframes floating{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0);
    }
}

@keyframes riseUp{

    0%{
        transform:
        translateY(0)
        rotate(0deg);

        opacity:0;
    }

    15%{
        opacity:0.9;
    }

    100%{
        transform:
        translateY(-110vh)
        rotate(25deg);

        opacity:0;
    }
}

@media(max-width:480px){

    .card{
        padding:30px 20px;
    }

    .mainText{
        font-size:21px;
    }

    .promise{
        font-size:18px;
    }

    .videoTitle{
        font-size:21px;
    }

    .finalText{
        font-size:30px;
    }
}

</style>
</head>


<body>


<!-- BACKGROUND MUSIC -->

<audio
    id="bgMusic"
    loop
    preload="auto">

    <source
        src="https://res.cloudinary.com/s4rjpsff/video/upload/v1788674319/don_t_say_sorry_just_say_-___%EF%B8%8F___like__share__subscribe__shortvideos__shorts_256k.mp3"
        type="audio/mpeg">

</audio>


<!-- PAGE 1 -->

<section
    class="page active"
    id="page1">

    <div class="card">

        <div class="emoji">
            🥺🫶🏻
        </div>

        <div class="mainText">

            Shreyaa bby thollyy 🥺<br>

            sslyy meraa ek soft heart hain<br>

            ma udhar se thollyyy bol rha hoon 🥺

            <br><br>

            Mudee mapp karr don 🥺

        </div>

        <div class="promise">

            I promise 🥺<br>

            I won't talk about big dicks anymore....

            <br>

            <small>
                (Not mid😁)
            </small>

        </div>

        <div
            class="musicStatus"
            id="musicStatus">

            🎵 Trying to start music...

        </div>

        <button
            id="continueBtn">

            Continue 🥺👉🏻👈🏻

        </button>

    </div>

</section>


<!-- PAGE 2 -->

<section
    class="page"
    id="page2">

    <div class="videoTitle">

        Shreyaa bby ektu eta dekho 🥺🫶🏻

    </div>

    <div class="videoBox">

        <video
            id="sorryVideo"
            controls
            playsinline
            preload="metadata">

            <source
                src="https://res.cloudinary.com/s4rjpsff/video/upload/v1788673996/SEND_THIS_TO_YOUR_FRIEND_SAYING_your_sorry__best_friend__720p.mp4"
                type="video/mp4">

        </video>

    </div>

    <button
        id="nextBtn">

        Next 🥺🫶🏻

    </button>

</section>


<!-- PAGE 3 -->

<section
    class="page"
    id="page3">

    <div class="finalEmoji">
        🥺🫶🏻
    </div>

    <div class="finalText">
        Baby really thollyyy 🥺🫶🏻
    </div>

    <div class="finalHeart">
        💗💗💗
    </div>

</section>


<script>

const bgMusic =
    document.getElementById("bgMusic");

const sorryVideo =
    document.getElementById("sorryVideo");

const continueBtn =
    document.getElementById("continueBtn");

const nextBtn =
    document.getElementById("nextBtn");

const musicStatus =
    document.getElementById("musicStatus");


bgMusic.volume = 0.55;


/* =========================
   PLAY MUSIC
========================= */

function playMusic(){

    return bgMusic.play()
        .then(function(){

            musicStatus.textContent =
                "🎵 Music is playing 🥺❤️";

        })
        .catch(function(){

            musicStatus.textContent =
                "🎵 Tap once to start music";

        });

}


/* =========================
   AUTOPLAY ATTEMPT
========================= */

window.addEventListener(
    "load",
    function(){

        playMusic();

    }
);


/* =========================
   FIRST USER INTERACTION
========================= */

document.addEventListener(
    "click",
    function(){

        if(bgMusic.paused){

            playMusic();

        }

    },
    {
        once:true
    }
);


/* =========================
   CONTINUE
========================= */

continueBtn.addEventListener(
    "click",
    function(){

        if(bgMusic.paused){
            playMusic();
        }

        document
            .getElementById("page1")
            .classList.remove("active");

        document
            .getElementById("page2")
            .classList.add("active");

    }
);


/* =========================
   VIDEO START
========================= */

sorryVideo.addEventListener(
    "play",
    function(){

        bgMusic.pause();

    }
);


/* =========================
   VIDEO END
========================= */

sorryVideo.addEventListener(
    "ended",
    function(){

        playMusic();

    }
);


/* =========================
   NEXT
========================= */

nextBtn.addEventListener(
    "click",
    function(){

        document
            .getElementById("page2")
            .classList.remove("active");

        document
            .getElementById("page3")
            .classList.add("active");

        if(bgMusic.paused){
            playMusic();
        }

    }
);


/* =========================
   FLOATING HEARTS
========================= */

function createHeart(){

    const heart =
        document.createElement("div");

    heart.className =
        "heartFloat";

    const emojis = [
        "💗",
        "💕",
        "💖",
        "💓",
        "🫶🏻",
        "🥺",
        "💞"
    ];

    heart.innerHTML =
        emojis[
            Math.floor(
                Math.random() *
                emojis.length
            )
        ];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (18 + Math.random() * 15) + "px";

    heart.style.animationDuration =
        (4 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(
        function(){
            heart.remove();
        },
        7000
    );
}


setInterval(
    createHeart,
    700
);

</script>

</body>
</html>
